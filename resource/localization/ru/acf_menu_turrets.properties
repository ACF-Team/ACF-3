# General settings labels
acf.menu.turrets=Башни
acf.menu.turrets.menu_title=Процедурные башни
acf.menu.turrets.menu_desc=Обычно размещайте горизонтальную башню, а затем присоедините к ней вертикальную башню, чтобы сделать полностью функциональную башню. Вы можете присоединить что угодно напрямую к частям башни, и они будут прикреплены и правильно поворачиваться.\\n\\nБашни, в иерархии которых находится оружие, считаются вооруженными и должны управляться наводчиком или контроллером башни, чтобы избежать серьезного штрафа к частоте обновления прицеливания.
acf.menu.turrets.components=Компоненты башни
