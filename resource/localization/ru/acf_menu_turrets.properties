acf.menu.turrets.actuator_size_desc=Более толстые актуаторы толкают сильнее, но движутся медленнее. Более длинный ход достает дальше, но тонкие гнутся при меньшей нагрузке. Длина корпуса примерно равна сумме хода штока и диаметра цилиндра.
